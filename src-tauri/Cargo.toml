[package]
name = "kumoswitch"
version = "0.17.0"
description = "Switch AI CLI providers without rewriting your config"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
similar = "3"
tiny_http = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "blocking"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = "0.6"
bytes = "1"
zeroize = "1"
sha2 = "0.11"
rusqlite = { version = "0.42", features = ["bundled"], default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(not(windows))'.dependencies]
keyring = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
