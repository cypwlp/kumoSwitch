# kumoSwitch mirror on kumoswitch.cypilu.cloud.
# This is a dedicated virtual host and must not take over the server's default site.
# Install: sudo cp nginx-kumoswitch.conf /etc/nginx/sites-available/kumoswitch
#          sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name kumoswitch.cypilu.cloud;

    root /var/www/kumoswitch;
    index index.html;

    charset utf-8;

    # Keep the ACME webroot available for the future TLS certificate.
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # static single-page site
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}