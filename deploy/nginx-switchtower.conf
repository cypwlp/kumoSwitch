# SwitchTower landing page on the bare IP (domain is ICP-blocked).
# Install: sudo cp nginx-switchtower.conf /etc/nginx/conf.d/switchtower.conf
#          sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen 8080;
    server_name 129.204.149.106;

    root /var/www/switchtower;
    index index.html;

    # single-page static site
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
