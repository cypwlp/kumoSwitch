name: tauri-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  webview2:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: npx tauri build --no-bundle --config tests/tauri/tauri.e2e.conf.json
      - run: npm run e2e:tauri
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-e2e-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
