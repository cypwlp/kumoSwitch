name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes_file="release-notes.md"
          awk -v version="${TAG#v}" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          if [ -s "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft "${notes_args[@]}"
          else
            gh release create "$TAG" \
              --draft \
              --title "kumoSwitch $TAG" \
              "${notes_args[@]}"
          fi
          release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare optional Authenticode signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $config = '{}'
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
            [IO.File]::WriteAllBytes("cert.pfx", $bytes)
            $pwd = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd | Out-Null
            $thumb = (Get-PfxCertificate cert.pfx).Thumbprint
            $config = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $thumb
                  digestAlgorithm = "sha256"
                  timestampUrl = "http://timestamp.digicert.com"
                }
              }
            } | ConvertTo-Json -Depth 5 -Compress
          }
          [IO.File]::WriteAllText("$PWD\windows-sign.json", $config)

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: false
          args: --target x86_64-pc-windows-msvc --config windows-sign.json

      - name: Upload signed portable exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $exe = Get-ChildItem src-tauri\target -Recurse -Filter kumoswitch.exe -File |
                 Where-Object { $_.FullName -match 'release' } | Select-Object -First 1
          if (-not $exe) { throw "portable exe not found" }
          $portable = Join-Path $PWD "kumoSwitch-portable.exe"
          Copy-Item $exe.FullName $portable -Force

          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $thumb = (Get-PfxCertificate cert.pfx).Thumbprint
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                        Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $thumb $portable
            if ($LASTEXITCODE -ne 0) { throw "portable Authenticode signing failed" }
          }
          gh release upload "$env:TAG" $portable --clobber

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: false
          args: --bundles deb,appimage

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - name: Configure optional Apple signing
        env:
          APPLE_CERTIFICATE_INPUT: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_INPUT: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_INPUT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_INPUT: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_INPUT: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_INPUT: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_INPUT" ]; then
            echo "Apple signing secrets not configured; building the unsigned Beta."
            exit 0
          fi

          for value in \
            "$APPLE_CERTIFICATE_PASSWORD_INPUT" \
            "$APPLE_SIGNING_IDENTITY_INPUT" \
            "$APPLE_ID_INPUT" \
            "$APPLE_PASSWORD_INPUT" \
            "$APPLE_TEAM_ID_INPUT"; do
            if [ -z "$value" ]; then
              echo "::warning::Apple certificate exists but notarization credentials are incomplete; building unsigned."
              exit 0
            fi
          done

          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_INPUT"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_INPUT"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_INPUT"
            echo "APPLE_ID=$APPLE_ID_INPUT"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_INPUT"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_INPUT"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles app,dmg

  updater-json:
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets --pattern '*' --clobber

      - name: Build one cross-platform latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_notes=$(gh release view "$TAG" --json body --jq .body)
          RELEASE_NOTES="$release_notes" node .github/scripts/build-latest-json.mjs release-assets latest.json "$RELEASE_TAG"

      - name: Upload updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" latest.json --clobber

  checksums:
    needs: [prepare, updater-json]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets --pattern '*' --clobber

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release-assets/SHA256SUMS.txt --clobber

  publish:
    needs: [prepare, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
