name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm ci --prefix ui

      - run: npm run build --prefix ui

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SwitchYard ${{ github.ref_name }}
          releaseBody: |
            Windows 10/11 x64。安裝檔（NSIS）或可攜版任選其一。

            - `SwitchYard_*_x64-setup.exe`：安裝版
            - `SwitchYard-portable.exe`：可攜版，免安裝不寫註冊表
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc

      - name: Upload portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(find src-tauri/target -type f -name switchyard.exe -path '*release*' | head -n 1)
          echo "portable source: $exe"
          cp "$exe" SwitchYard-portable.exe
          gh release upload "${{ github.ref_name }}" SwitchYard-portable.exe --clobber
