name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - name: Rust tests
        shell: pwsh
        run: |
          & cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Annotate Rust test failures
        if: failure()
        shell: pwsh
        run: |
          $pattern = '^failures:|FAILED|panicked|assertion|^---- .* stdout ----'
          $lines = Get-Content cargo-test.log
          $matches = $lines | Select-String -Pattern $pattern | Select-Object -Last 40
          if (-not $matches) {
            # Compile errors and setup failures often do not match test panic patterns.
            $matches = $lines | Select-Object -Last 80
          }
          $matches | ForEach-Object {
            $line = if ($_.Line) { $_.Line } else { [string]$_ }
            $message = $line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Rust test failure::$message"
          }
